<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | All For You</title>

<link rel="stylesheet" href="css/style.css?v=25">
<link rel="stylesheet" href="css/auth.css?v=1">

</head>

<body>

<!-- HEADER -->

<header class="main-header">

    <div class="header-top">

        <a href="index.html" class="store-logo">
            <img
                src="IMG_9663.png"
                alt="All For You"
                class="brand-logo-image">
        </a>

        <div class="header-actions">

            <a href="index.html" class="header-icon">
                🏠
            </a>

            <a href="cart.html" class="header-icon">
                🛒
            </a>

        </div>

    </div>

</header>

<!-- LOGIN -->

<section class="auth-section">

    <div class="auth-box">

        <img
            src="IMG_9663.png"
            class="auth-logo"
            alt="Logo">

        <h1>

            Welcome Back

        </h1>

        <p>

            Login to your account

        </p>

        <form id="loginForm">

            <div class="input-group">

                <label>

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="input-group">

                <label>

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <button
                type="submit"
                class="auth-btn">

                Login

            </button>

        </form>

        <div class="auth-links">

            <a href="#">

                Forgot Password?

            </a>

        </div>

        <p class="register-text">

            Don't have an account?

            <a href="register.html">

                Register Here

            </a>

        </p>

    </div>

</section>

<script type="module" src="js/login.js"></script>

</body>

</html>
