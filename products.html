<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products - All For You</title>

<link rel="stylesheet" href="css/style.css?v=9">
</head>

<body>

<!-- ===== MODERN HEADER ===== -->

<header class="main-header">

    <div class="header-top">

        <a href="index.html" class="store-logo">
            <span class="logo-icon">🛍️</span>
            <span>All For You</span>
        </a>

        <div class="header-search">

            <input
                id="searchBox"
                type="text"
                placeholder="Search products..."
                onkeyup="searchProduct()"
            >

            <button onclick="searchProduct()" aria-label="Search">
                🔍
            </button>

        </div>

        <div class="header-actions">

            <a href="wishlist.html"
               class="header-icon icon-with-badge">
                ❤️
                <b class="wishlist-count counter-badge">0</b>
            </a>

            <a href="cart.html"
               class="header-icon icon-with-badge">
                🛒
                <b class="cart-count counter-badge">0</b>
            </a>

        </div>

    </div>


    <nav class="main-nav">

        <a href="index.html">Home</a>
        <a href="products.html">All Products</a>
        <a href="products.html">Electronics</a>
        <a href="products.html">Fashion</a>
        <a href="products.html">Home & Living</a>
        <a href="products.html">Beauty</a>

    </nav>

</header>


<!-- ===== PRODUCTS ===== -->

<section class="products">

    <h1>Our Products</h1>

    <div class="product-grid">


        <!-- SMART WATCH -->

        <div class="product-card">

            <span class="sale">SALE</span>

            <a href="product.html?item=smart-watch">
                <img
                    src="./IMG_9535.jpeg"
                    alt="Smart Watch"
                >
            </a>

            <h3>
                <a href="product.html?item=smart-watch">
                    Smart Watch
                </a>
            </h3>

            <div>⭐⭐⭐⭐⭐</div>

            <p>£39.99</p>

            <button onclick="addToCart('Smart Watch',39.99)">
                Add To Cart 🛒
            </button>

            <button onclick="addToWishlist('Smart Watch')">
                ❤️ Wishlist
            </button>

        </div>


        <!-- WIRELESS EARBUDS -->

        <div class="product-card">

            <span class="sale">SALE</span>

            <a href="product.html?item=wireless-earbuds">
                <img
                    src="./IMG_9536.webp"
                    alt="Wireless Earbuds"
                >
            </a>

            <h3>
                <a href="product.html?item=wireless-earbuds">
                    Wireless Earbuds
                </a>
            </h3>

            <div>⭐⭐⭐⭐⭐</div>

            <p>£24.99</p>

            <button onclick="addToCart('Wireless Earbuds',24.99)">
                Add To Cart 🛒
            </button>

            <button onclick="addToWishlist('Wireless Earbuds')">
                ❤️ Wishlist
            </button>

        </div>


        <!-- HOME GADGET -->

        <div class="product-card">

            <a href="product.html?item=home-gadget">
                <img
                    src="./IMG_9537.jpeg"
                    alt="Home Gadget"
                >
            </a>

            <h3>
                <a href="product.html?item=home-gadget">
                    Home Gadget
                </a>
            </h3>

            <div>⭐⭐⭐⭐</div>

            <p>£29.99</p>

            <button onclick="addToCart('Home Gadget',29.99)">
                Add To Cart 🛒
            </button>

            <button onclick="addToWishlist('Home Gadget')">
                ❤️ Wishlist
            </button>

        </div>


    </div>

</section>


<!-- ===== FOOTER ===== -->

<footer>

    <h3>All For You</h3>

    <p>Quality products at affordable prices.</p>

    <p>© 2026 All For You. All Rights Reserved.</p>

</footer>


<script src="js/script.js?v=15"></script>

</body>
</html>
