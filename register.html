<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | All For You</title>

<link rel="stylesheet" href="css/style.css?v=25">
<link rel="stylesheet" href="css/auth.css?v=1">

</head>

<body>

<header class="main-header">

<div class="header-top">

<a href="index.html" class="store-logo">

<img src="IMG_9663.png"
class="brand-logo-image"
alt="All For You">

</a>

<div class="header-actions">

<a href="index.html" class="header-icon">🏠</a>

<a href="cart.html" class="header-icon">🛒</a>

</div>

</div>

</header>

<section class="auth-section">

<div class="auth-box">

<img
src="IMG_9663.png"
class="auth-logo"
alt="Logo">

<h1>Create Account</h1>

<p>Create your All For You account</p>

<form id="registerForm">

<div class="input-group">

<label>Full Name</label>

<input
type="text"
id="fullName"
placeholder="Enter your full name"
required>

</div>

<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Create password"
required>

</div>

<div class="input-group">

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm password"
required>

</div>

<button
type="submit"
class="auth-btn">

Create Account

</button>

</form>

<p class="register-text">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</section>

<script type="module" src="js/register.js"></script>

</body>

</html>
