<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wishlist - All For You</title>

<link rel="stylesheet" href="css/style.css?v=9">
</head>

<body>

<!-- ===== MODERN HEADER ===== -->

<header class="main-header">

    <div class="header-top">

        <a href="index.html" class="store-logo">
            <span class="logo-icon">🛍️</span>
            <span>All For You</span>
        </a>

        <div class="header-search">

            <input
                id="searchBox"
                type="text"
                placeholder="Search products..."
            >

            <button
                onclick="window.location.href='products.html'"
                aria-label="Search">
                🔍
            </button>

        </div>


        <div class="header-actions">

            <!-- WISHLIST -->

            <a href="wishlist.html"
               class="header-icon icon-with-badge">

                ❤️

                <b class="wishlist-count counter-badge">
                    0
                </b>

            </a>


            <!-- CART -->

            <a href="cart.html"
               class="header-icon icon-with-badge">

                🛒

                <b class="cart-count counter-badge">
                    0
                </b>

            </a>

        </div>

    </div>


    <nav class="main-nav">

        <a href="index.html">Home</a>
        <a href="products.html">All Products</a>
        <a href="products.html">Electronics</a>
        <a href="products.html">Fashion</a>
        <a href="products.html">Home & Living</a>
        <a href="products.html">Beauty</a>

    </nav>

</header>


<!-- ===== WISHLIST ===== -->

<section class="products">

    <h1>Your Wishlist ❤️</h1>

    <p style="margin-top:10px; color:#666;">
        Products you've saved for later
    </p>

    <div id="wishlist-items" class="product-grid">

        <p>Your wishlist is empty.</p>

    </div>

</section>


<!-- ===== FOOTER ===== -->

<footer>

    <h3>All For You</h3>

    <p>
        Quality products at affordable prices.
    </p>

    <p>
        © 2026 All For You. All Rights Reserved.
    </p>

</footer>


<script src="js/script.js?v=15"></script>

</body>

</html>
